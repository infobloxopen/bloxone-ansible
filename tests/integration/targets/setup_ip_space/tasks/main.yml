---
- module_defaults:
    group/infoblox.bloxone.all:
      csp_url: "{{ csp_url }}"
      api_key: "{{ api_key }}"
  block:
    # Create a random View name to avoid conflicts
    - ansible.builtin.set_fact:
        name: "test-view-{{ 999999 | random | string }}"

    # Create an Ip Space
    - name: "Create an IP space"
      infoblox.bloxone.ipam_ip_space:
        name: "{{ name }}"
        state: "present"
      register: _ip_space
