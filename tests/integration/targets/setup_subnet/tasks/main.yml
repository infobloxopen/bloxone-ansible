---
- module_defaults:
    group/infoblox.bloxone.all:
      csp_url: "{{ csp_url }}"
      api_key: "{{ api_key }}"
  block:
    - name: "Create a subnet"
      infoblox.bloxone.ipam_subnet:
        address: "10.0.0.0"
        cidr: 24
        space: "{{ _ip_space.id }}"
        state: "present"
      register: _subnet
